<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090909">
<title>{% block title %}Rejoin — ระบบกู้เกมอัตโนมัติ{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#090909; --bg-2:#121212; --bg-3:#1c1c1c; --elev:#1c1c1c;
    --hover:rgba(255,255,255,.045); --hover-2:rgba(255,255,255,.075);
    --border:#292929; --border-2:#404040; --border-3:#606060;
    --text:#f5f5f5; --text-2:#d4d4d4; --muted:#a3a3a3; --dim:#929292;
    --accent:#d4d4d4; --accent-h:#ffffff;
    --green:#4cb782; --amber:#f2c94c; --red:#eb5757; --blue:#4ea7fc;
  }
  html{background:var(--bg)}
  body{
    margin:0; color:var(--text); font-size:14px; line-height:1.5; letter-spacing:-.006em;
    font-family:"Inter","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    background:radial-gradient(900px 550px at 85% 0,rgba(255,255,255,.035),transparent 70%),var(--bg);
    background-attachment:fixed;
  }
  a{color:var(--accent);text-decoration:none}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent-h);outline-offset:4px}
  .skip-link{position:fixed;top:8px;left:8px;z-index:100;padding:12px;background:var(--elev);border-radius:8px;transform:translateY(-150%)}
  .skip-link:focus{transform:none}
  ::selection{background:rgba(255,255,255,.25);color:#fff}

  .ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;
      stroke-linejoin:round;vertical-align:-.14em;flex:none}
  .ic.fill{fill:currentColor;stroke:none}

  /* ---------- app shell ---------- */
  .app{display:flex;min-height:100vh}
   .sidebar{position:fixed;top:0;left:0;bottom:0;width:248px;z-index:50;display:flex;flex-direction:column;
            gap:6px;padding:24px 16px;background:rgba(18,18,18,.96);border-right:1px solid var(--border);overflow-y:auto}
  .side-brand{display:flex;align-items:center;gap:10px;padding:6px 6px 14px;margin-bottom:6px;
              border-bottom:1px solid var(--border)}
   .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none;
        background:linear-gradient(135deg,#404040,#202020);
        box-shadow:0 1px 3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18)}
  .logo .ic{width:16px;height:16px}
   .side-brand b{display:block;font-size:20px;font-weight:700;letter-spacing:-.04em;line-height:1.4}
   .side-brand span{display:block;font-size:11px;color:var(--dim)}
   .side-brand .logo{display:grid;color:#fff}
   .nav-label{font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--dim);padding:18px 10px 8px}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1}
   .nav-item{display:flex;align-items:center;gap:12px;min-height:46px;padding:10px 12px;border-radius:10px;
            color:var(--muted);font-size:13.5px;font-weight:500;transition:background .12s,color .12s}
  .nav-item .ic{width:16px;height:16px}
  .nav-item:hover{background:var(--hover);color:var(--text)}
   .nav-item.active{background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.04));color:var(--text);box-shadow:inset 3px 0 var(--accent)}
  .nav-item.active .ic{color:var(--accent-h)}
  .side-foot{border-top:1px solid var(--border);padding-top:10px;display:flex;align-items:center;gap:6px}
  .side-foot .uchip{flex:1;min-width:0}
   .content{flex:1;min-width:0;margin-left:248px;display:flex;flex-direction:column}
  .mobilebar{display:none;position:sticky;top:0;z-index:30;align-items:center;gap:10px;height:52px;
              padding:0 14px;background:rgba(9,9,9,.9);backdrop-filter:blur(12px) saturate(180%);
             border-bottom:1px solid var(--border)}
  .mobilebar b{font-size:14px;font-weight:600}
  .mobilebar .logo{width:24px;height:24px;border-radius:7px}
  .mobilebar .logo .ic{width:13px;height:13px}
  .scrim{display:none}

  .uchip{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px;min-width:0}
  .uchip .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;
             font-size:11px;font-weight:600;color:#fff;background:linear-gradient(135deg,#404040,#202020)}
  .uchip .nm{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- layout ---------- */
   .wrap{max-width:1200px;margin:0 auto;padding:40px 36px 80px;width:100%}
  .page-head{margin-bottom:22px}
   .page-head h1{margin:0 0 8px;font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.035em}
  .page-head p{margin:0;font-size:13px;color:var(--muted);line-height:1.6;max-width:640px}

  /* ---------- section head ---------- */
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
  .sec-head h2{margin:0;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
  .sec-head h2 .ic{width:15px;height:15px;color:var(--dim)}
  .count{font-size:11px;font-weight:500;color:var(--dim);background:var(--hover);
         border:1px solid var(--border);border-radius:6px;padding:1px 6px}

  /* ---------- buttons ---------- */
   .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 14px;
       border-radius:8px;border:1px solid transparent;font:inherit;font-size:13px;font-weight:500;
       cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s,box-shadow .12s}
  .btn .ic{width:15px;height:15px}
  .btn:focus-visible{outline:2px solid var(--accent-h);outline-offset:3px}
  .btn:active{transform:translateY(.5px)}
   .btn.primary{background:#ededed;color:#111;box-shadow:0 4px 14px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.18)}
  .btn.primary:hover{background:var(--accent-h)}
  .btn.default{background:var(--hover);color:var(--text-2);border-color:var(--border)}
  .btn.default:hover{background:var(--hover-2);color:var(--text);border-color:var(--border-2)}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--hover);color:var(--text)}
  .btn.success{background:rgba(76,183,130,.12);color:#5fc99a;border-color:rgba(76,183,130,.28)}
  .btn.success:hover{background:rgba(76,183,130,.18)}
  .btn.danger{background:rgba(235,87,87,.1);color:#ef7a7a;border-color:rgba(235,87,87,.26)}
  .btn.danger:hover{background:rgba(235,87,87,.16)}
   .btn.icon{width:40px;padding:0}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn.loading{pointer-events:none;opacity:.6}

  /* ---------- badge ---------- */
  .badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;
         font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
  .badge .ic{width:13px;height:13px}
  .b-armed{color:#5fc99a;background:rgba(76,183,130,.1);border-color:rgba(76,183,130,.22)}
  .b-ready{color:#e6c356;background:rgba(242,201,76,.1);border-color:rgba(242,201,76,.22)}
  .b-rejoin{color:var(--text-2);background:rgba(255,255,255,.08);border-color:var(--border-2)}
  .b-alert{color:#ef7a7a;background:rgba(235,87,87,.1);border-color:rgba(235,87,87,.24)}
  .b-game{color:#e6c356;background:rgba(242,201,76,.08);border-color:rgba(242,201,76,.2)}
  .b-offline{color:var(--muted);background:var(--hover);border-color:var(--border)}
  .b-conn{color:#7fb8f0;background:rgba(78,167,252,.1);border-color:rgba(78,167,252,.22)}

  .none{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 16px;text-align:center;
        font-size:12.5px;color:var(--dim);border:1px dashed var(--border-2);border-radius:9px}
  .none .ic{width:20px;height:20px;color:var(--border-3)}

  /* ---------- card ---------- */
   .card{border:1px solid var(--border);border-radius:16px;background:var(--bg-2);padding:22px}

  /* ---------- empty ---------- */
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;
          padding:64px 20px;border:1px dashed var(--border-2);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent)}
  .empty .big{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--muted);
              background:var(--hover);border:1px solid var(--border);margin-bottom:14px}
  .empty h2{margin:0 0 5px;font-size:15px;font-weight:600}
  .empty p{margin:0 0 18px;font-size:13px;color:var(--muted);max-width:360px}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
         padding:20px;background:rgba(3,4,5,.6);backdrop-filter:blur(3px)}
  .modal.open{display:flex;animation:fade .14s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal-card{width:100%;max-width:420px;background:var(--elev);border:1px solid var(--border-2);
               border-radius:18px;padding:26px;max-height:calc(100dvh - 40px);overflow-y:auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.75);animation:pop .16s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .modal-card h3{margin:0 0 5px;font-size:15px;font-weight:600}
  .modal-card p{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.55}
  .modal-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px}
  .modal-ic.ok{color:#5fc99a;background:rgba(76,183,130,.12);border:1px solid rgba(76,183,130,.24)}
  .modal-ic.warn{color:#ef7a7a;background:rgba(235,87,87,.12);border:1px solid rgba(235,87,87,.24)}
  .modal-ic .ic{width:20px;height:20px}
  .modal-card label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
   input[type=text]{width:100%;height:46px;background:var(--bg);border:1px solid var(--border-2);color:var(--text);
                   border-radius:8px;padding:0 12px;font:inherit;font-size:14px}
  input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.15)}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;font-weight:600;letter-spacing:1.5px;
        color:var(--text);background:var(--bg);border:1px solid var(--border-2);border-radius:9px;
        padding:16px;text-align:center;word-break:break-all;margin:4px 0 2px}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);z-index:80;display:flex;
         align-items:center;gap:9px;padding:11px 15px;border-radius:9px;background:var(--elev);
         border:1px solid var(--border-2);color:var(--text);font-size:13px;font-weight:500;
         box-shadow:0 12px 30px -12px rgba(0,0,0,.75);opacity:0;pointer-events:none;
         transition:opacity .18s,transform .18s;max-width:92vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast .ic{width:16px;height:16px;color:var(--green)}

  {% block head %}{% endblock %}

  /* ---------- responsive ---------- */
  @media(max-width:820px){
    .wrap{padding:28px 24px 70px}
    .sidebar{transform:translateX(-100%);transition:transform .22s ease;
             box-shadow:0 20px 60px -20px rgba(0,0,0,.8)}
    .sidebar.open{transform:none}
    .content{margin-left:0}
    .mobilebar{display:flex}
    .scrim.show{display:block;position:fixed;inset:0;z-index:45;background:rgba(3,4,5,.55);
                backdrop-filter:blur(2px)}
  }
  @media(max-width:560px){
    .wrap{padding:24px 16px 48px}
    .mobilebar{height:60px}
    .modal{padding:12px}
    .modal-card{padding:22px;max-height:calc(100dvh - 24px)}
    .modal-actions{flex-wrap:wrap}
    .modal-actions .btn{flex:1}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip-link" href="#main">ข้ามไปเนื้อหา</a>

  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>

  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-gamepad" viewBox="0 0 24 24"><line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><rect x="2" y="6" width="20" height="12" rx="6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
  <symbol id="i-smartphone" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
</defs></svg>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <span class="logo"><svg class="ic" style="width:16px;height:16px;stroke-width:2.4"><use href="#i-refresh"/></svg></span>
      <div><b>Rejoin</b><span>ระบบกู้เกมอัตโนมัติ</span></div>
    </div>

    <div class="nav-label">WORKSPACE</div>
    <nav class="nav" aria-label="เมนูหลัก">
      <a class="nav-item {{ 'active' if active == 'dashboard' }}" href="/">
        <svg class="ic"><use href="#i-monitor"/></svg> แดชบอร์ด
      </a>
      <a class="nav-item {{ 'active' if active == 'guide' }}" href="/guide">
        <svg class="ic"><use href="#i-book"/></svg> วิธีใช้งาน
      </a>
      <a class="nav-item {{ 'active' if active == 'bypass' }}" href="/bypass">
        <svg class="ic"><use href="#i-zap"/></svg> Bypass
      </a>
    </nav>

    <div class="side-foot">
      <div class="uchip">
        <span class="av">{{ (user.username or user.discord_id or '?')[0]|upper }}</span>
        <span class="nm">{{ user.username or user.discord_id }}</span>
      </div>
      <button class="btn ghost icon" title="ออกจากระบบ" aria-label="ออกจากระบบ" onclick="logout()">
        <svg class="ic"><use href="#i-logout"/></svg>
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim" onclick="toggleNav(false)"></div>

  <div class="content">
    <header class="mobilebar">
      <button id="navToggle" class="btn ghost icon" title="เมนู" aria-label="เมนู" aria-controls="sidebar" aria-expanded="false" onclick="toggleNav()">
        <svg class="ic"><use href="#i-menu"/></svg>
      </button>
      <span class="logo"><svg class="ic" style="width:13px;height:13px;stroke-width:2.4"><use href="#i-refresh"/></svg></span>
      <b>{% block mobiletitle %}Rejoin{% endblock %}</b>
    </header>

    <main class="wrap" id="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><svg class="ic"><use href="#i-check"/></svg><span id="toastText"></span></div>

<script>
/* ---------------- toast ---------------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------------- modal ---------------- */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.addEventListener('click', e => {
  if (e.target.classList.contains('modal')) closeModal(e.target.id);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal.open').forEach(m => m.classList.remove('open'));
  if (e.key === 'Escape') toggleNav(false);
});

/* ---------------- sidebar (มือถือ) ---------------- */
function toggleNav(force){
  const sb = document.getElementById('sidebar');
  const sc = document.getElementById('scrim');
  const open = force === undefined ? !sb.classList.contains('open') : force;
  const wasOpen = sb.classList.contains('open');
  sb.classList.toggle('open', open);
  sc.classList.toggle('show', open);
  document.getElementById('navToggle').setAttribute('aria-expanded', String(open));
  document.body.style.overflow = open ? 'hidden' : '';
  sb.inert = !open && window.matchMedia('(max-width:820px)').matches;
  if (open) sb.querySelector('a').focus();
  else if (wasOpen) document.getElementById('navToggle').focus();
}
window.matchMedia('(min-width:821px)').addEventListener('change', () => toggleNav(false));
toggleNav(false);

/* ---------------- ออกจากระบบ ---------------- */
async function logout(){
  await fetch('/auth/logout', {method:'POST'});
  location.href = '/';
}
</script>
