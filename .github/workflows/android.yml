# Android APK — สร้างด้วย GitHub Actions (ไม่ต้องติดตั้ง SDK บนเครื่อง)
# ดูรายละเอียด: android/README.md
name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch: {} # กด build เองได้จากหน้า Actions

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # อย่าใช้ค่า default (มี 'tools' ซึ่ง Google ลบออกจาก repo แล้ว → error)
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rejoin-agent-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
