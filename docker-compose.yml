# Infra สำหรับ production (Phase 1)
# รัน: docker compose up -d
# หมายเหตุ: Docker ต้องมีสิทธิ์ (อยู่ในกลุ่ม docker หรือใช้ sudo)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rejoin
      POSTGRES_PASSWORD: rejoin
      POSTGRES_DB: rejoin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rejoin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
